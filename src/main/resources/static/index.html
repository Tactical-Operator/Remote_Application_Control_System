<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Remote Pulse</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Remote Pulse</h1>
    <p id="server-address">
        Server - Loading...
    </p>

    <!-- =========================
         Main Tile Grid
         ========================= -->

    <div id="tile-container" class="tile-container">
        <!-- Tiles are created by JavaScript -->
    </div>


    <!-- =========================
         Configuration Modal
         ========================= -->

    <div id="config-modal" class="modal hidden">

        <div class="modal-content">

            <h2>Configure Tile</h2>

            <p id="config-slot"></p>

            <button id="installed-app-button">
                Installed Application
            </button>

            <button id="custom-app-button">
                Custom App
            </button>

            <button id="website-button">
                Website
            </button>

            <button id="config-cancel-button">
                Cancel
            </button>

        </div>

    </div>


    <!-- =========================
         Installed Applications Modal
         ========================= -->

    <div id="installed-app-modal" class="modal hidden">

        <div class="modal-content installed-app-content">

            <h2>Installed Applications</h2>

            <p id="installed-app-slot"></p>

            <input type="text" id="installed-app-search" placeholder="Search applications..." autocomplete="off">

            <div id="installed-app-list" class="installed-app-list">
            </div>

            <button id="installed-app-close-button">
                Cancel
            </button>

        </div>

    </div>


    <!-- =========================
         Custom App Modal
         ========================= -->

    <div id="custom-app-modal" class="modal hidden">

        <div class="modal-content custom-app-content">

            <h2>Custom Application</h2>

            <p id="custom-app-slot"></p>

            <label for="custom-app-path">
                EXE Path
            </label>

            <input type="text" id="custom-app-path" placeholder="Paste EXE path here..." autocomplete="off">

            <p id="custom-app-name">
                Application: -
            </p>

            <button id="custom-app-save-button">
                Save
            </button>

            <button id="custom-app-close-button">
                Cancel
            </button>

        </div>

    </div>


    <!-- =========================
         Website Modal
         ========================= -->

    <div id="website-modal" class="modal hidden">

        <div class="modal-content website-content">

            <h2>Website Configuration</h2>

            <p id="website-slot"></p>

            <label for="website-url">
                Website URL
            </label>

            <input type="text" id="website-url" placeholder="https://example.com" autocomplete="off">

            <p id="website-name">
                Website: -
            </p>

            <button id="website-save-button">
                Save
            </button>

            <button id="website-close-button">
                Cancel
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
